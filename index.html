<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Go Pro AI SIGNAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: #090c14;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #particleCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(15px);
            width: 95%;
            max-width: 420px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 0 60px rgba(0, 210, 255, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(to right, #00d2ff, #fff, #00d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(145deg, #1c2436, #121620);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #2c3e50;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .info-item { display: flex; flex-direction: column; }
        .label { font-size: 11px; color: #7f8c8d; font-weight: 600; }
        .value { font-size: 15px; font-weight: bold; color: #ecf0f1; font-family: monospace; margin-top: 4px; }

        #timer { 
            font-size: 19px; 
            background: -webkit-linear-gradient(#ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-box {
            position: relative;
            background: linear-gradient(135deg, #1a202c, #121620);
            padding: 5px;
            border-radius: 20px;
            min-height: 260px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .result-box::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, #00d2ff, transparent 40%);
            animation: rotateBorder 4s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBorder { 100% { transform: rotate(360deg); } }

        .result-inner {
            position: relative;
            z-index: 1;
            background: #131823;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 250px;
        }

        .loader { font-size: 14px; color: #00d2ff; letter-spacing: 2px; font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .big-small { font-size: 45px; font-weight: 900; margin: 10px 0; text-transform: uppercase; letter-spacing: 2px; }

        .color-badge { padding: 6px 24px; border-radius: 50px; font-weight: bold; font-size: 13px; margin-bottom: 15px; text-transform: uppercase; }

        .number-badge {
            font-size: 60px;
            font-weight: bold;
            color: #fff;
            background: radial-gradient(circle at 30% 30%, #34495e, #000);
            width: 100px; height: 100px;
            line-height: 100px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .green-text { color: #00e065; }
        .red-text { color: #ff4757; }
        .violet-text { color: #c471ed; }

        .bg-green { background: linear-gradient(to right, #00b894, #00e065); color: #000; }
        .bg-red { background: linear-gradient(to right, #d63031, #ff4757); color: #fff; }
        .bg-violet { background: linear-gradient(to right, #8e44ad, #c471ed); color: #fff; }

        .connection-box {
            margin-top: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .blue-glow {
            color: #00d2ff;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
            animation: glowBlue 2s infinite alternate;
        }

        .green-glow {
            color: #00e065;
            text-shadow: 0 0 10px #00e065, 0 0 20px #00e065;
            animation: glowGreen 2s infinite alternate;
        }

        @keyframes glowBlue { from { opacity: 0.7; } to { opacity: 1; } }
        @keyframes glowGreen { from { opacity: 0.7; } to { opacity: 1; } }
    </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="container">

    <h1>𝐖𝐈𝐍 𝐆𝐎 𝐏𝐑𝐎 𝐀𝐈 𝐒𝐈𝐆𝐍𝐀𝐋</h1>

    <div class="info-bar">
        <div class="info-item" style="text-align: left; width: 70%;">
            <span class="label">PERIOD NUMBER</span>
            <span class="value" id="periodID">Loading...</span>
        </div>
        <div class="info-item" style="text-align: right;">
            <span class="label">TIMER</span>
            <span class="value" id="timer">--</span>
        </div>
    </div>

    <div class="result-box">
        <div class="result-inner">

            <div id="loading" class="loader">ANALYZING...</div>

            <div id="resultShow" style="display: none; text-align: center;">
                <div class="big-small" id="bsText">BIG</div>
                <div class="color-badge" id="colorBadge">GREEN</div>
                <div class="number-badge" id="numberText">0</div>
            </div>

            <div class="connection-box">
                <span class="blue-glow">● AI Connected</span>
                <span class="green-glow">● Server Active</span>
            </div>

            <!-- CREDIT -->
            <div style="
                margin-top:15px;
                font-size:14px;
                font-weight:bold;
                text-align:center;
                color:#00d2ff;
                text-shadow:0 0 10px #00d2ff, 0 0 20px #00d2ff, 0 0 40px #00d2ff;
                animation: glowBlue 2s infinite alternate;
            ">
                Mᴀᴅʏ ʙʏ :- @𝐏𝐀𝐑𝐓𝐇𝐎_𝐓𝐇𝐄_𝐎𝐍𝐄𝐱𝐱
            </div>

        </div>
    </div>

</div>

<script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 210, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 70; i++) particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }

    initParticles();
    animate();

    // ---------------- 1 Minute Logic -----------------

    const periodEl = document.getElementById('periodID');
    const timerEl = document.getElementById('timer');
    const resultDiv = document.getElementById('resultShow');
    const loaderDiv = document.getElementById('loading');
    const bsText = document.getElementById('bsText');
    const colorBadge = document.getElementById('colorBadge');
    const numberText = document.getElementById('numberText');

    function updateSystem() {
        const now = new Date();
        const utcHours = now.getUTCHours();
        const utcMinutes = now.getUTCMinutes();
        const utcSeconds = now.getUTCSeconds();

        // Period logic (Every 1 minute)
        const year = now.getUTCFullYear();
        const month = String(now.getUTCMonth() + 1).padStart(2, '0');
        const day = String(now.getUTCDate()).padStart(2, '0');

        const totalMinutes = (utcHours * 60) + utcMinutes;
        let periodIndex = totalMinutes + 1;

        const formattedIndex = String(periodIndex).padStart(4, '0');
        const currentPeriod = `${year}${month}${day}10001${formattedIndex}`;

        periodEl.innerText = currentPeriod;

        // TIMER (60 seconds)
        let remainingSeconds = 60 - utcSeconds;
        timerEl.innerText = `00:${remainingSeconds < 10 ? '0' + remainingSeconds : remainingSeconds}`;

        if (remainingSeconds <= 7) {
            timerEl.style.color = '#ff4757';
            resultDiv.style.display = 'none';
            loaderDiv.style.display = 'block';
            loaderDiv.innerText = "CALCULATING...";
        } else {
            timerEl.style.color = '#00e065';
            if (loaderDiv.style.display === 'block' || resultDiv.style.display === 'none') {
                predictResult(currentPeriod);
                loaderDiv.style.display = 'none';
                resultDiv.style.display = 'block';
            }
        }
    }

    function predictResult(periodString) {
        const seed = parseInt(periodString.slice(-4));
        const algo = (seed * 7 + 3) % 10;
        const randomNum = algo;

        numberText.innerText = randomNum;
        let size = randomNum >= 5 ? 'BIG' : 'SMALL';
        bsText.innerText = size;

        bsText.className = 'big-small';
        colorBadge.className = 'color-badge';

        if ([1, 3, 7, 9].includes(randomNum)) {
            bsText.classList.add('green-text');
            colorBadge.innerText = 'GREEN';
            colorBadge.classList.add('bg-green');
        } 
        else if ([2, 4, 6, 8].includes(randomNum)) {
            bsText.classList.add('red-text');
            colorBadge.innerText = 'RED';
            colorBadge.classList.add('bg-red');
        } 
        else {
            bsText.classList.add('violet-text');
            colorBadge.innerText = 'VIOLET';
            colorBadge.classList.add('bg-violet');
        }
    }

    setInterval(updateSystem, 200);
</script>

</body>
</html>
